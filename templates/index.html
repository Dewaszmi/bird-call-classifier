<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bird Call Classifier</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f7f2;
      --card: #ffffff;
      --text: #1f2a1f;
      --muted: #5f6f5f;
      --accent: #2f6b3a;
      --border: #d8e2d8;
      --error: #b42318;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121814;
        --card: #1a231c;
        --text: #e8efe8;
        --muted: #9cab9c;
        --accent: #6fcf7f;
        --border: #2d3a30;
        --error: #f97066;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at top left, rgba(47, 107, 58, 0.12), transparent 35%),
        var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 2rem;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: 2rem;
    }

    p {
      margin: 0 0 1.5rem;
      color: var(--muted);
      line-height: 1.5;
    }

    form {
      display: grid;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    input[type="file"] {
      width: 100%;
      padding: 0.9rem;
      border: 1px dashed var(--border);
      border-radius: 12px;
      background: transparent;
      color: var(--text);
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 0.85rem 1.4rem;
      background: var(--accent);
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .status {
      min-height: 1.5rem;
      color: var(--muted);
    }

    .status.error {
      color: var(--error);
    }

    .result {
      display: none;
      gap: 1.5rem;
    }

    .result.visible {
      display: grid;
    }

    .best-match {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .chart-wrap {
      position: relative;
      height: 320px;
      max-width: 420px;
      width: 100%;
      margin: 0 auto;
    }

    ul {
      margin: 0;
      padding-left: 1.2rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Bird Call Classifier</h1>
    <p>Upload a bird call recording to see the top three predicted species and the combined probability of all remaining classes.</p>

    <form id="upload-form">
      <input id="audio-input" type="file" name="audio" accept="audio/*,.wav,.mp3,.flac,.ogg,.m4a,.aac" required>
      <button id="submit-btn" type="submit">Classify</button>
    </form>

    <div id="status" class="status"></div>

    <section id="result" class="result">
      <div class="best-match" id="best-match"></div>
      <div class="chart-wrap">
        <canvas id="prediction-chart"></canvas>
      </div>
      <ul id="prediction-list"></ul>
    </section>
  </main>

  <script>
    const form = document.getElementById("upload-form");
    const audioInput = document.getElementById("audio-input");
    const submitBtn = document.getElementById("submit-btn");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    const bestMatchEl = document.getElementById("best-match");
    const predictionListEl = document.getElementById("prediction-list");
    const chartCanvas = document.getElementById("prediction-chart");

    let chart = null;

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle("error", isError);
    }

    function formatPercent(value) {
      return `${(value * 100).toFixed(2)}%`;
    }

    function renderResult(data) {
      bestMatchEl.textContent = `Best match: ${data.best_match}`;
      predictionListEl.innerHTML = "";

      for (const entry of data.predictions) {
        const item = document.createElement("li");
        item.textContent = `${entry.species}: ${formatPercent(entry.probability)}`;
        predictionListEl.appendChild(item);
      }

      if (data.other > 0) {
        const item = document.createElement("li");
        item.textContent = `Other: ${formatPercent(data.other)}`;
        predictionListEl.appendChild(item);
      }

      resultEl.classList.add("visible");

      if (typeof Chart === "undefined") {
        setStatus("Chart library failed to load. Check your internet connection.", true);
        return;
      }

      if (chart) {
        chart.destroy();
        chart = null;
      }

      requestAnimationFrame(() => {
        chart = new Chart(chartCanvas, {
          type: "pie",
          data: {
            labels: data.chart.labels,
            datasets: [{
              data: data.chart.values,
              backgroundColor: [
                "#2f6b3a",
                "#5f9b6d",
                "#8ec89a",
                "#c9e3cf",
              ],
            }],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: "bottom",
              },
              tooltip: {
                callbacks: {
                  label(context) {
                    const value = context.raw;
                    return `${context.label}: ${formatPercent(value)}`;
                  },
                },
              },
            },
          },
        });
      });
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const file = audioInput.files[0];
      if (!file) {
        setStatus("Choose an audio file first.", true);
        return;
      }

      const formData = new FormData();
      formData.append("audio", file);

      submitBtn.disabled = true;
      resultEl.classList.remove("visible");
      setStatus("Running inference...");

      try {
        const response = await fetch("/predict", {
          method: "POST",
          body: formData,
        });
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Prediction failed.");
        }

        renderResult(data);
        setStatus("Prediction complete.");
      } catch (error) {
        setStatus(error.message, true);
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
